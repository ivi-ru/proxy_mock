fail_fast: false
default_language_version:
  python: python3.14
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.8
  hooks:
  - id: ruff
    args: [
      --line-length=120,
      --target-version=py314,
      --ignore=F405,
      --ignore=F403,
      --ignore=E722,
      --ignore=E402,
      --fix,
    ]
    types_or: [python, pyi]

  - id: ruff-format
    args: [
      --line-length=120,
    ]
    types_or: [python, pyi]
