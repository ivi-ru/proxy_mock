services:
  proxy-mock:
    image: ${PROXY_MOCK_IMAGE:-ghcr.io/ivi-ru/proxy_mock:2.12.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/proxy_mock', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${PROXY_MOCK_PORT:-15000}:5000"

  app:
    image: python:3.12-slim
    working_dir: /example
    volumes:
      - ./app.py:/example/app.py:ro
    command: ["python", "app.py"]
    environment:
      INVENTORY_URL: http://proxy-mock:5000
    depends_on:
      proxy-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"

  check:
    image: python:3.12-slim
    working_dir: /example
    volumes:
      - ./check.py:/example/check.py:ro
    command: ["python", "check.py"]
    profiles: ["check"]
    depends_on:
      app:
        condition: service_healthy
