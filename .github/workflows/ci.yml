name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: AGENTS.md refers to real make targets
        run: .github/scripts/check_agents_targets.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest --cov -v

  lowest-bounds:
    # The declared lower bounds are a promise to anyone installing proxy-mock into an existing
    # project. The locked versions never exercise them, so they are resolved and tested here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install the lowest declared versions of the direct dependencies
        run: |
          uv venv --python 3.11 .venv-lowest
          uv pip install --python .venv-lowest --resolution lowest-direct \
            . "pytest>=9.0.3,<10" "pytest-cov>=7.0.0,<8"

      - name: Report what was resolved
        run: uv pip list --python .venv-lowest

      - name: pytest
        run: .venv-lowest/bin/python -m pytest -q

  wheel:
    # Unit tests import the package from the working tree and would not notice a packaging
    # mistake: a missing module, an unregistered entry point, a console script that does not run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Build the distributions
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl pytest requests

      - name: Run the smoke test outside the repository
        run: |
          cp .github/smoke/test_installed_package.py "$RUNNER_TEMP/"
          cp -R examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          ./venv/bin/pytest -q test_installed_package.py examples

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image
        run: docker build --build-arg PYTHON_VERSION=3.14-slim -t proxy_mock .

      - name: The image starts and serves
        run: |
          docker run -d --rm --name proxy_mock -p 5000:5000 proxy_mock
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/proxy_mock > /dev/null; then
              docker stop proxy_mock
              exit 0
            fi
            sleep 1
          done
          docker logs proxy_mock
          docker stop proxy_mock
          exit 1

      - name: Verify the container-to-container example
        working-directory: examples/compose
        env:
          PROXY_MOCK_IMAGE: proxy_mock
        run: |
          docker compose up -d --wait proxy-mock app
          docker compose run --rm check

      - name: Clean up the example
        if: always()
        working-directory: examples/compose
        run: docker compose down --remove-orphans
